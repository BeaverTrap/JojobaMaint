<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Jojoba Hills Maintenance</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f6f7f5;
        color: #1a201c;
        text-align: center;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1211;
          color: #e9ede9;
        }
      }
      .badge {
        font-size: 2.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      p {
        margin: 0;
        color: #6b7280;
        max-width: 22rem;
      }
      button {
        margin-top: 0.5rem;
        border: none;
        border-radius: 0.75rem;
        background: #2d6a47;
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.6rem 1.25rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="badge">🛠️</div>
    <h1>You're offline</h1>
    <p>
      Jojoba Hills Maintenance needs an internet connection to load the latest
      posts and articles. Reconnect and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
